steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=$_VITE_API_URL'
      - '-t'
      - '$_IMAGE'
      - '.'

images:
  - '$_IMAGE'

substitutions:
  _VITE_API_URL: 'https://placeholder.run.app'
  _IMAGE: 'us-central1-docker.pkg.dev/career-492408/eduguard/frontend:v2'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
