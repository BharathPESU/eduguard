# Build Docker on GitHub Actions → push to Artifact Registry → deploy Cloud Run.
# Does NOT use gcloud builds submit (avoids career-492408_cloudbuild bucket permission).
#
# Required GitHub secrets: GCP_SA_KEY, VITE_API_URL
# Setup guide: eduguard-frontend/DEPLOY.md

name: Deploy Frontend

on:
  push:
    branches:
      - frontend
    paths:
      - 'eduguard-frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || 'career-492408' }}
      GCP_REGION: ${{ vars.GCP_REGION != '' && vars.GCP_REGION || 'us-central1' }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE != '' && vars.CLOUD_RUN_SERVICE || 'eduguard-frontend' }}
      IMAGE_REPO: us-central1-docker.pkg.dev/career-492408/eduguard/frontend
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::Missing GitHub secret GCP_SA_KEY. See eduguard-frontend/DEPLOY.md"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "::error::Missing GitHub secret VITE_API_URL (production backend URL)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_TAG="${IMAGE_REPO}:${SHORT_SHA}"
          echo "Building ${IMAGE_TAG}"
          echo "Backend URL: ${VITE_API_URL}"
          docker build \
            --build-arg "VITE_API_URL=${VITE_API_URL}" \
            -t "${IMAGE_TAG}" \
            -t "${IMAGE_REPO}:latest" \
            ./eduguard-frontend
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_REPO}:latest"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image="${IMAGE_TAG}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --quiet

      - name: Print service URL
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)'
