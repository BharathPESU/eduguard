# Build and deploy the React frontend to Cloud Run on every push to `frontend`.
#
# Required GitHub secrets: GCP_SA_KEY, VITE_API_URL
# Setup guide: eduguard-frontend/DEPLOY.md

name: Deploy Frontend

on:
  push:
    branches:
      - frontend
    paths:
      - 'eduguard-frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || 'career-492408' }}
      GCP_REGION: ${{ vars.GCP_REGION != '' && vars.GCP_REGION || 'us-central1' }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE != '' && vars.CLOUD_RUN_SERVICE || 'eduguard-frontend' }}
      IMAGE_REPO: us-central1-docker.pkg.dev/career-492408/eduguard/frontend
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::Missing GitHub secret GCP_SA_KEY. See eduguard-frontend/DEPLOY.md"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_API_URL }}" ]; then
            echo "::error::Missing GitHub secret VITE_API_URL (production backend URL)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and deploy (Cloud Build → Cloud Run)
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "Deploying tag: ${SHORT_SHA}"
          echo "Backend URL: ${VITE_API_URL}"
          gcloud builds submit ./eduguard-frontend \
            --project="${GCP_PROJECT_ID}" \
            --config=eduguard-frontend/cloudbuild.yaml \
            --substitutions="_VITE_API_URL=${VITE_API_URL},_TAG=${SHORT_SHA},_SERVICE_NAME=${CLOUD_RUN_SERVICE},_REGION=${GCP_REGION},_IMAGE_REPO=${IMAGE_REPO},_PROJECT_ID=${GCP_PROJECT_ID}"

      - name: Print service URL
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)'
